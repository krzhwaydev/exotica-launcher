name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }} # <--- ВОТ ЭТА СТРОЧКА ЖЕСТКО ПРИВЯЖЕТ ФАЙЛ К ТЕГУ
          files: target/release/exotica.exe # <--- ПРОВЕРЬ ИМЯ ФАЙЛА (у тебя exotica или roblox_optimizer?)